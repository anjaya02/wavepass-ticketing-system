version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: wavepass-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wavepass-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wavepass-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/wavepass
      - JWT_SECRET=wavepass_production_secure_jwt_token_key_change_me
      - CLIENT_URL=http://localhost:5173
      - EVENT_NAME=WavePass: Your Boat Ride Ticketing System
      - EVENT_DATE=2024-12-20
      - TICKET_PRICE=2800
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wavepass-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wavepass-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - wavepass-net

volumes:
  mongo-data:
    name: wavepass-mongo-data

networks:
  wavepass-net:
    name: wavepass-network
    driver: bridge
